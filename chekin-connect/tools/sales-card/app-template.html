<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#385BF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi QR Chekin">
<link rel="apple-touch-icon" href="__ICON__">
<title>Chekin Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#385BF8;--navy:#19194B;--ink:#161643;--muted:#6B6B95;--soft:#EFEFFF;--line:#DEDEEB;--f:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#19194B}
body{font-family:var(--f);font-weight:400;color:var(--ink);min-height:100dvh;text-align:center;background:#F4F6F9}
body.mode-qr{background:#F4F6F9;color:var(--ink)}
#app{min-height:100dvh;display:flex;flex-direction:column}
.col{position:relative;max-width:400px;margin:0 auto;padding:0 22px 14px;width:100%}
.col.wide{max-width:760px}
.hide{display:none!important}
button,input,select{font-family:var(--f)}

.logo{display:block;margin:0 auto;height:28px;width:auto;position:relative;top:14px}
.logo.white{filter:brightness(0) invert(1)}
.langBtn{border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:999px;padding:6px 12px;font:600 12px var(--f);cursor:pointer}
.cl-lang{position:absolute;top:14px;right:22px}
.langSel{position:relative;display:inline-block}
.langSel.cl-lang{position:absolute;top:14px;right:22px}.langSel .ls-cur{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:6px 10px;font:700 11px var(--f);letter-spacing:.05em;cursor:pointer}
.ls-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(15,20,80,.2);padding:4px;min-width:150px;z-index:50}.ls-menu[hidden]{display:none}
.ls-menu button{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:10px;font:600 13px var(--f);color:var(--ink);text-align:left;cursor:pointer}.ls-menu button small{font:700 10px var(--f);color:var(--muted);letter-spacing:.06em}.ls-menu button.on{background:var(--soft);color:var(--blue)}

/* ---------- ADMIN ---------- */
.ahead{padding:6px 0 4px;position:relative}
.ahead h1{font:800 24px var(--f);letter-spacing:-.6px;margin-top:18px}
.ahead p{font:400 13px var(--f);color:var(--muted);margin-top:2px}
.atools{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:0 0 14px}
.who{font:500 12px var(--f);color:var(--muted);margin-top:6px}.who b{color:var(--ink,#161643);font-weight:700}
.atools .langBtn{position:static}
.langBtn.exit{text-decoration:none;border-color:#C9D2F3;color:#5B6190;font-size:11px;padding:6px 10px}
.langBtn.exit:hover{color:#385BF8;border-color:#385BF8}
.tabs{display:flex;gap:2px;margin:18px 0 14px;overflow-x:auto;scrollbar-width:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{flex:1 0 auto;border:0;background:transparent;border-radius:999px;padding:10px 11px;font:600 12px var(--f);color:var(--blue);cursor:pointer;white-space:nowrap}
.tabs::-webkit-scrollbar{display:none}
@media(max-width:560px){.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-radius:22px;overflow:visible;gap:2px}.tabs button{grid-column:span 2;padding:10px 4px;white-space:normal;line-height:1.15}.tabs button:nth-child(n+4){grid-column:span 3}}
.tabs button.on{background:var(--blue);color:#fff}
.prow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.ptype{font:700 15px var(--f)}.ptype small{display:block;font:500 11px var(--f);color:var(--muted);margin-top:2px}.pcells{display:flex;flex-wrap:wrap;gap:8px 14px}.pcell{display:flex;align-items:center;gap:6px;font:500 12px var(--f)}.pcell>b{font:700 11px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:56px}.pcell .chip{margin-top:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;margin-bottom:14px;box-shadow:0 6px 18px rgba(56,91,248,.07)}
.panel h2{font:700 17px var(--f);letter-spacing:-.3px;margin-bottom:10px}
.panel.blue{background:linear-gradient(180deg,#002CFA 0%,#274BF0 100%);border:0;color:#fff;box-shadow:0 14px 30px rgba(56,91,248,.3)}
.panel.blue label{color:#E8EEFF}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font:600 11px var(--f);color:var(--muted);margin:12px 0 5px}
.grid2 label,.panel h2+label{margin-top:0}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=url],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font:500 14px var(--f);background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}
.panel.blue input{border-color:#fff}
select{background-image:linear-gradient(45deg,transparent 50%,#385BF8 50%),linear-gradient(135deg,#385BF8 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus{outline:0;box-shadow:0 0 0 3px rgba(56,91,248,.2)}
.hint{font:400 11px var(--f);color:var(--muted);margin-top:5px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:10px 14px;font:600 13px var(--f);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{border-color:#FF2467;color:#FF2467}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:10px}
.btn.full{width:100%;padding:13px;font-size:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;box-shadow:0 6px 18px rgba(56,91,248,.07)}
.rcard.inactive{opacity:.6}
.rtop{display:flex;gap:12px;align-items:center}
.ravatar{width:54px;height:54px;border-radius:50%;background:var(--soft);color:var(--blue);font:700 20px var(--f);display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line)}
.ravatar img{width:100%;height:100%;object-fit:cover}
.rinfo{flex:1;min-width:0}.rinfo b{display:block;font:700 15px var(--f)}.rinfo span{display:block;font:400 12px var(--f);color:var(--muted)}
.rinfo code{display:block;font:500 11px ui-monospace,monospace;color:var(--blue);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rqr{width:64px;height:64px;flex:none;border:1px solid var(--line);border-radius:10px;padding:4px;background:#fff}.rqr svg{width:100%;height:100%;display:block}
.chip{display:inline-block;font:600 10px var(--f);padding:3px 9px;border-radius:99px;background:#E7F8EE;color:#0F8A47;margin-top:4px}
.rinfo .chip{display:inline-block}
.chip.off{background:#F1F2F7;color:#6B7280}
.ract{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:flex-start}
.more{flex:0 0 auto}
.more[open]{flex:1 1 100%}
.more summary{list-style:none;cursor:pointer;display:inline-flex;width:auto}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{background:var(--soft)}
.morebox{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}.kpi b{display:block;font:800 24px var(--f);color:var(--blue)}.kpi span{font:500 11px var(--f);color:var(--muted)}
table{width:100%;border-collapse:collapse;font:400 12px var(--f)}
th{text-align:left;color:var(--muted);font-weight:600;padding:7px 5px;border-bottom:1px solid var(--blue);white-space:nowrap}
td{padding:9px 5px;border-bottom:1px solid #E6EBFF;vertical-align:top}
.scroll{overflow-x:auto}
.empty{font:400 13px var(--f);color:var(--muted);padding:18px;text-align:center}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--ink);border-radius:99px;padding:3px 10px 3px 4px;font:500 12px var(--f)}
.tchip i{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:var(--blue);overflow:hidden;flex:none}
.tchip b{font-weight:600}.tchip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 2px}
.pool{display:flex;flex-wrap:wrap;gap:8px}.drag{cursor:grab;padding-right:12px;border:1px solid var(--line);background:#fff}
.rcard.over{outline:2px dashed var(--blue);background:#F2F5FF}
.warn{background:#FFF6E5;border:1px solid #FFD58A;color:#8A5A00;border-radius:14px;padding:10px 14px;font:500 12px var(--f);margin-bottom:12px;text-align:left}
.rinfo .chip:not(.off):not(.evc){color:#0F8A47}
.chip.pend{background:#FFF1D6;color:#9A6200}
.me-q .panel{margin-bottom:10px}
.fills{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}.chip.fill{background:#12A150;color:#fff}.chip.miss{background:#fff;color:#B45309;border:1.5px dashed #F2A33A;padding:1.5px 8px}
.chip.evc{background:#E8EDFF;color:var(--blue)}
.demo{font:400 11px var(--f);color:var(--muted);margin:6px 0 24px;line-height:1.5}

/* modal */
.modal.center{align-items:center;padding:16px}.modal.center .sheet{border-radius:24px;max-width:420px;padding-top:22px}.modal.center .grab{display:none}
body:has(.modal) .backfab{display:none}
.solcard.off{opacity:.55;cursor:default}.solcard .soon{font:700 10.5px var(--f);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:4px 9px;border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(15,20,80,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 22px;text-align:left}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h2{font:700 19px var(--f);margin-bottom:6px}
.photoRow{display:flex;gap:12px;align-items:center;margin-top:4px}
.photoRow .ravatar{width:64px;height:64px}
.checkRow{display:flex;gap:10px;align-items:center;margin-top:14px;font:500 13px var(--f);color:var(--ink)}
.checkRow input{width:18px;height:18px;accent-color:#385BF8}
.err{color:#FF2467;font:500 12px var(--f);margin:8px 0;min-height:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font:600 12px var(--f);z-index:30}

/* ---------- PANTALLA QR (comercial) ---------- */
.arcbox{position:relative;width:100%;height:84px;margin:34px auto 0}
.arc{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible}
.qrcard{position:relative;margin:8px auto 14px;width:min(86vw,380px,50dvh);aspect-ratio:1;background:#fff;border-radius:26px;padding:12px;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 18px 40px rgba(10,14,80,.35)}
.qrcard svg.qr{width:100%;height:100%;display:block}
.qrlogo{position:absolute;left:50%;top:50%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:20%;border:4px solid #fff;background:#fff}
.scan{font:700 19px var(--f);color:#fff;margin-top:6px;letter-spacing:-.2px}
.evline{font:400 13px var(--f);color:#DCE5FF;margin-top:4px;line-height:1.6}

/* ---------- TARJETA CLIENTE ---------- */
.avatar{width:clamp(64px,9.5dvh,82px);height:clamp(64px,9.5dvh,82px);border-radius:50%;margin:26px auto 6px;padding:4px;border:1.5px solid var(--blue);background:#fff;box-shadow:0 8px 22px rgba(56,91,248,.2)}
.avatar>*{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.name{font:700 22px var(--f);letter-spacing:-.4px}
.role{font:400 13px var(--f);color:var(--muted);margin-top:2px}
.hero{position:relative;height:88px;margin:14px auto 12px;width:100%}
.tag1{position:absolute;left:0;right:0;top:32px;font:700 25px var(--f);letter-spacing:-.8px;line-height:1.14}
.line1{display:block;min-height:1.14em;color:var(--ink)}
.verb{color:var(--blue)}
.caret{display:inline-block;width:2px;height:.82em;background:var(--blue);margin-left:2px;vertical-align:-.06em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tail{display:block}
.list{display:grid;gap:9px;margin-top:2px;text-align:left}
.item{width:min(100%,276px);margin:0 auto;transition:width .3s ease;border-radius:18px;background:rgba(255,255,255,.82);border:1px solid rgba(56,91,248,.22);overflow:hidden;box-shadow:0 6px 18px rgba(56,91,248,.08)}
.item.open{width:100%}
.item .head{display:flex;align-items:center;gap:12px;width:100%;padding:7px 14px 7px 8px;background:none;border:0;text-align:left;font:600 14.5px var(--f);color:var(--ink);cursor:pointer;text-decoration:none;position:relative}
.item .head:not(:has(.chev))::after{content:"";width:36px;flex:none}
.head .lb{flex:1;text-align:center}
.head .ic{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(56,91,248,.12)}
svg.i2{width:20px;height:20px;fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chev{width:36px;height:15px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s;flex:none}
.item.open .chev{transform:rotate(90deg)}
.item.primary{background:linear-gradient(180deg,#002CFA 0%,#274BF0 100%);border-color:transparent;box-shadow:0 14px 30px rgba(56,91,248,.35)}
.item.primary .head{color:#fff}
.item.primary .ic{background:rgba(255,255,255,.2);box-shadow:none}
.item.primary svg.i2,.item.primary .chev{stroke:#fff}
.pan{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .pan{grid-template-rows:1fr}
.pan>div{overflow:hidden}
.pan .in{padding:2px 18px 18px;color:var(--ink)}
.item.primary .pan .in{color:#fff}
.in .sub{font:400 12px var(--f);color:#DCE5FF;margin:0 0 4px}
.in.info{font:500 13px var(--f);line-height:1.8;text-align:center}.in.info b{font:700 15px var(--f)}
.item.primary label{color:#E8EEFF;margin:12px 0 5px}
.item.primary input,.item.primary select{border-color:#fff}
.item.primary input:focus,.item.primary select:focus{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label{margin-top:0}
.phone{display:grid;grid-template-columns:112px 1fr;gap:8px}
.prog{display:flex;align-items:center;gap:10px;margin:16px 0 2px;font:500 11px var(--f);color:#DCE5FF}
.bar{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:.25s}
.item.primary .err{color:#FFD4D0}
.go{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:#fff;color:var(--blue);font:700 15px var(--f);cursor:pointer;box-shadow:0 0 0 4px rgba(255,255,255,.22);text-decoration:none;text-align:center}
.ok{text-align:center;padding:8px 0 2px}.ok .big{font-size:32px}.ok b{font:700 19px var(--f);display:block;margin:4px 0}
.ok .sub{display:block;margin:2px 0 6px}
.tag{display:inline-block;border:1px solid #fff;color:#fff;font:600 11px var(--f);padding:3px 12px;border-radius:99px;margin:4px 0 6px}
.cta{margin-top:12px}
.lnk{display:block;margin-top:12px;font:500 13px var(--f);color:#fff;text-decoration:underline;text-align:center}
.foot{margin-top:8px;font:500 12px var(--f);color:var(--muted)}
.foot a{color:var(--blue);text-decoration:none;font-weight:600}
.item{transition:box-shadow .25s}
.item.done{background:linear-gradient(180deg,#002CFA 0%,#274BF0 100%);border-color:transparent;box-shadow:0 10px 24px rgba(56,91,248,.3)}
.item.done .head{color:#fff}
.item.done .ic{background:rgba(255,255,255,.2);box-shadow:none}
.item.done svg.i2,.item.done .chev{stroke:#fff}
.backfab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#161643;color:#fff;border:0;border-radius:999px;padding:11px 20px;font:600 13px var(--f);box-shadow:0 8px 24px rgba(10,14,80,.35);cursor:pointer}
.qrbtns{flex-wrap:wrap}
.wbtn{padding:8px 13px;font-size:12px}
.wbtn.sm{padding:7px 14px;font-size:12px;flex:none}
.seelink{display:block;margin-top:12px;color:#DCE5FF;font:500 12px var(--f);text-decoration:underline}
.ihint{display:flex;align-items:center;gap:10px;margin:16px auto 0;max-width:340px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:10px 8px 10px 14px;text-align:left;color:#fff}
.ihint div{flex:1}.ihint b{display:block;font:700 13px var(--f)}.ihint span{display:block;font:400 11.5px var(--f);color:#DCE5FF;margin-top:1px}
.ix{border:0;background:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:0 6px}
.steps{margin:6px 0 0 18px;padding:0;font:500 14px var(--f);line-height:1.7;color:var(--ink)}
.kpis.kp6{grid-template-columns:repeat(3,1fr)}
.list.big{gap:12px}
.list.big .item{width:min(100%,300px)}
.list.big .item.open{width:100%}
.list.big .item .head{padding:10px 14px 10px 10px;font-size:15.5px}
.list.big .head .ic{width:40px;height:40px}
button.solcard{width:100%;text-align:left;cursor:pointer;font-family:var(--f)}
.solcard.static{cursor:default}
.lnk2{display:block;margin:14px auto 0;background:none;border:0;color:var(--blue);font:600 13px var(--f);cursor:pointer;text-decoration:underline}
.rbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--blue);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.rbtn svg.i2{width:18px;height:18px}
.cl-share{position:absolute;top:11px;left:22px}
.qrbtns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.wbtn{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:10px 20px;font:600 13px var(--f);cursor:pointer}
.foot2{margin-top:14px;font:500 12px var(--f);color:#C9D3FF}
/* ---------- formulario de contacto en la tarjeta ---------- */
.lf{display:grid;gap:8px;text-align:left;margin-top:6px}
.lf label{display:block;font:600 11px var(--f);color:#E8EEFF;margin:0}
.lf input[type=text],.lf input[type=tel],.lf input[type=email],.lf input[type=number]{width:100%;margin-top:4px;border:1.5px solid rgba(255,255,255,.9);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;font:500 16px var(--f)}
.lf input:focus{outline:0;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.lf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lf-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.lf .lf-consent{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;margin-top:4px;font:400 11.5px/1.45 var(--f);color:#E8EEFF}
.lf .lf-consent input{width:18px;height:18px;margin:1px 0 0;accent-color:#fff}
.lf .lf-consent a{color:#fff;font-weight:700}
.lf .lf-err{color:#FFD4D0;min-height:0;margin:2px 0}
.lf-title{font:700 14px var(--f);margin:2px 0 4px;color:#fff}
.lf.light label{color:var(--muted)}
.lf.light input[type=text],.lf.light input[type=tel],.lf.light input[type=email],.lf.light input[type=number]{border-color:var(--line);background:#F6F8FF}
.lf.light input:focus{box-shadow:0 0 0 3px rgba(56,91,248,.2);border-color:var(--blue)}
.lf.light .lf-consent{color:var(--muted)}
.lf.light .lf-consent input{accent-color:var(--blue)}
.lf.light .lf-consent a{color:var(--blue)}
.lf.light .lf-err{color:#FF2467}
button.wb{cursor:pointer;font-family:var(--f)}
.wbtns.one{grid-template-columns:1fr}
.lf-who a{color:#fff;font-weight:700}
.wbtns{margin-top:10px}

/* ---------- página de cada persona (?me=1 · /mi-perfil) ---------- */
body.mode-login{background:linear-gradient(180deg,#002CFA 0%,#274BF0 100%) fixed}
.me-login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.me-login .logo{position:static;height:30px;margin:0 auto 24px}
.me-login .logo.white{filter:brightness(0) invert(1)}
.me-card{width:100%;max-width:400px;background:#fff;border-radius:26px;padding:28px 22px 24px;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 22px 50px rgba(10,14,80,.4);text-align:left}
.me-ic{width:52px;height:52px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.me-ic img{width:30px;height:30px;border-radius:7px}
.me-card h1{font:800 22px var(--f);text-align:center;letter-spacing:-.01em}
.me-card .sub{margin:4px 0 14px;text-align:center;font:400 13.5px/1.5 var(--f);color:var(--muted)}
.me-field{margin-top:14px}
.me-field label{display:block;font:700 12px var(--f);color:var(--ink);margin:0 0 6px}
.me-field input,.me-bar select{width:100%;font:500 16px var(--f);color:var(--ink);padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#F6F8FF}
.me-field input:focus,.me-bar select:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(56,91,248,.15)}
.me-pw{position:relative}.me-pw input{padding-right:72px}
.me-pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font:700 12px var(--f);padding:10px;cursor:pointer}
.me-hint{font:400 12px/1.5 var(--f);color:var(--muted);margin-top:5px}
.me-ev{font:500 13px/1.4 var(--f);color:var(--muted);margin:10px 2px 0}.me-ev b{color:var(--ink,#161643)}
.me-err{color:#FF2467;font:600 13px/1.4 var(--f);margin-top:10px;min-height:0}
.me-btn{width:100%;margin-top:16px;border:0;border-radius:999px;padding:14px 18px;font:700 15px var(--f);color:#fff;background:linear-gradient(180deg,#002CFA 0%,#274BF0 100%);box-shadow:0 10px 24px rgba(56,91,248,.3);cursor:pointer}
.me-btn[disabled]{opacity:.6;cursor:progress}
.me-help{margin-top:14px;font:400 12px/1.5 var(--f);color:var(--muted);text-align:center}
.me-link{border:0;background:none;color:var(--blue);font:700 13px var(--f);cursor:pointer;padding:6px 0;text-decoration:underline}
.me-wrap{width:100%;max-width:560px;margin:0 auto;padding:0 18px 48px;text-align:left}
.me-wrap.wide{max-width:900px}
.me-top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px}
.me-top .logo{position:static;height:26px;margin:0}
.me-tools{display:flex;gap:6px;align-items:center}
.me-h1{font:800 24px var(--f);letter-spacing:-.4px;margin:6px 0 2px}
.me-h{font:700 17px var(--f);letter-spacing:-.3px;margin:24px 0 10px}
.me-h span{color:var(--muted);font-weight:600}
.me-prof{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 6px 18px rgba(56,91,248,.07)}
.me-ph{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.me-av{position:relative;width:92px;height:92px;border-radius:50%;padding:3px;border:1.5px solid var(--blue);background:#fff;cursor:pointer;flex:none}
.me-av img,.me-av>svg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.me-av .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:2px solid #fff}
.me-name{font:800 20px var(--f);letter-spacing:-.3px}
.me-role{font:400 13px var(--f);color:var(--muted);margin:2px 0 4px}
.me-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.me-lead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.me-lead-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.me-lead-h b{font:700 15px var(--f)}.me-lead-h span{font:500 11.5px var(--f);color:var(--muted);white-space:nowrap}
.me-lead-m{font:400 13px/1.5 var(--f);color:var(--muted);margin-top:2px;word-break:break-word}
.me-lead-a{display:flex;gap:8px;margin-top:10px}
.me-pwbox{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 16px 16px}
.me-pwbox summary{cursor:pointer;font:700 14px var(--f);padding:12px 0;list-style:none}
.me-pwbox summary::-webkit-details-marker{display:none}
.me-pwbox[open] summary{border-bottom:1px solid var(--line);margin-bottom:4px}
.me-bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.me-bar select{width:auto;flex:1 1 220px;padding:10px 12px}
.me-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.me-list .me-lead{margin:0}
.me-team{display:grid;gap:8px}
.me-tm{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.me-tm b{flex:1 1 140px;font:700 14px var(--f)}
/* escáner de tarjetas (perfil del Account Executive) */
.me-scan{margin-top:18px}
.me-scan>.me-link{display:block;margin:6px auto 0}
.me-scan-box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 0 5px rgba(26,148,255,.173);padding:16px 16px 18px}
.me-scan-box h3{font:700 16px var(--f);margin:0}
.me-scan-box .me-field label{color:#385BF8}
.me-scan-box .me-field input.filled,.me-scan-box .me-field textarea.filled{border-color:#385BF8}
.me-scan-box>.me-link{display:block;margin:8px auto 0}
.me-scan-img{display:block;width:100%;max-height:180px;object-fit:contain;border-radius:8px;background:#F4F6F9;margin-top:12px}
.me-scan-st{font:500 13px/1.4 var(--f);color:var(--muted);margin-top:10px}
.me-row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.me-field textarea{width:100%;min-height:84px;resize:vertical;font:500 16px var(--f);color:#161643;padding:13px 14px;border-radius:8px;border:1px solid rgba(22,22,67,.2);background:#F4F6F8}
.me-field textarea.filled{background:#fff;border-color:#161643}
.me-field textarea:focus{outline:0;border-color:#161643;box-shadow:0 0 0 3px rgba(56,91,248,.2)}
.me-check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font:500 14px/1.4 var(--f);color:#161643;cursor:pointer}
.me-check input{width:20px;height:20px;margin:0;flex:none;accent-color:#385BF8}
.me-scan-a{display:flex;gap:8px}.me-scan-a .me-btn{flex:1}
.me-btn.ghost{background:#fff;color:#385BF8;box-shadow:inset 0 0 0 1px #385BF8}
.me-tag{display:inline-block;font:700 11px var(--f);font-style:normal;color:#385BF8;background:#EEF2FF;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}

/* pantalla de QR: logo, frase animada y QR repartidos por toda la altura (QR en la parte baja) */
.col.qr{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.col.qr .logo{top:0;margin-top:clamp(20px,4.2dvh,48px)}
.col.qr .sp{display:block;flex:1 1 0;min-height:14px}
.col.qr .sp.s1{flex-grow:1}.col.qr .sp.s2{flex-grow:1}.col.qr .sp.s3{flex-grow:.8}
.col.qr{max-width:460px;padding-left:18px;padding-right:18px}
.col.qr .qrcard{margin:0 auto;width:min(100%,400px,50dvh)}
.qhead{font:700 clamp(26px,3.6dvh,33px) var(--f);letter-spacing:-.8px;line-height:1.14;color:var(--ink)}
.qhead .line1{display:block;min-height:1.14em;color:var(--ink)}
.qhead .verb{color:var(--blue)}
.qhead .caret{background:var(--blue)}
.col.qr .qrcard{box-shadow:0 0 0 1px rgba(56,91,248,.18),0 16px 38px rgba(56,91,248,.2)}
/* tarjeta del cliente: en móviles bajos queda compacta; en los largos el espacio sobrante se reparte por igual entre bloques (nada pegado, sin hueco al final) */
.col.cl{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.col.cl .sp{display:block;flex:0 0 0}
@media(min-height:600px){
.col.cl .sp{flex:1 1 0;min-height:0}
.col.cl .sp.s1{flex-grow:1.1}
.col.cl .sp.s4{flex-grow:.7}
.col.cl .foot{margin-top:0}
}
.col.cl .foot{margin-top:8px;padding-top:0}
@media(min-height:700px){
.col.cl .sp{min-height:10px}
.col.cl .sp.s1{min-height:16px}
.col.cl .sp.s4{min-height:12px}
.col.cl .logo{top:0;margin-top:clamp(22px,4.2dvh,52px)}
.col.cl .avatar{width:clamp(76px,12.5dvh,128px);height:clamp(76px,12.5dvh,128px);margin:0 auto clamp(8px,1.6dvh,18px)}
.col.cl .name{font-size:clamp(23px,3.2dvh,29px)}
.col.cl .role{margin-top:clamp(3px,.7dvh,8px);font-size:clamp(13px,1.7dvh,15px)}
.col.cl .hero{height:clamp(96px,14dvh,140px);margin:0 auto}
.col.cl .tag1{top:clamp(34px,5.4dvh,56px);font-size:clamp(25px,3.3dvh,30px)}
.col.cl .list.big{gap:clamp(10px,1.9dvh,20px)}
.col.cl .list.big .item{width:min(100%,clamp(300px,82vw,340px))}
.col.cl .list.big .item .head{padding-top:clamp(10px,1.9dvh,19px);padding-bottom:clamp(10px,1.9dvh,19px);font-size:clamp(15.5px,2dvh,17px)}
.col.cl .foot{margin-top:0}
}
/* anillos que laten alrededor de la foto */
.avatar{position:relative}
.avatar::before,.avatar::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(56,91,248,.5);animation:ring 2.6s ease-out infinite;pointer-events:none}
.avatar::after{animation-delay:1.3s}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){.avatar::before,.avatar::after{animation:none;opacity:0}}
/* Escríbeme */
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px}
.wb{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #fff;border-radius:14px;padding:12px 8px;background:#fff;color:var(--blue);font:700 14px var(--f);text-decoration:none}
.wb.off{opacity:.45;border-style:dashed;background:rgba(255,255,255,.15);color:#fff}
.item.primary .wb svg.i2{stroke:var(--blue)}
.item.primary .wb.off svg.i2{stroke:#fff}
.msgprev{margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.14);text-align:left}
.msgprev b{display:block;font:700 11px var(--f);color:#DCE5FF;margin-bottom:4px}
.msgprev span{font:400 12.5px var(--f);line-height:1.5;color:#fff}
.hint2{font:400 11px var(--f);color:#DCE5FF;margin-top:10px;line-height:1.5}
/* fila doble Web | LinkedIn */
.item.pair{display:grid;grid-template-columns:1fr 1fr}
.item.pair .head{justify-content:center;gap:8px;padding:6px 8px}
.item.pair .head::after{display:none!important}
.item.pair .head+.head{border-left:1px solid rgba(56,91,248,.22)}
.item.pair .head .lb{flex:0 1 auto}
/* panel de soluciones */
.sheet{position:relative}
.sheet .grab{width:42px;height:4px;border-radius:99px;background:#DEDEEB;margin:0 auto 14px}
.sheet .x{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);color:var(--blue);font-size:20px;line-height:1;cursor:pointer}
.solcard{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:10px;border:1px solid rgba(56,91,248,.22);border-radius:18px;background:#fff;text-decoration:none;color:var(--ink);font:600 14.5px var(--f)}
.solcard .ic{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.solcard .lb2{flex:1}
.solcard small{display:block;font:400 11.5px var(--f);color:var(--muted);margin-top:2px;line-height:1.35}
.solcard .chev{width:15px;height:15px;stroke:var(--blue)}
.go.blue{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(56,91,248,.18);margin-top:16px}
/* página del equipo */
.fchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
.fchips button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:8px 16px;font:600 12.5px var(--f);cursor:pointer}
.fchips button.on{background:var(--blue);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,190px));justify-content:center;gap:12px;margin-top:18px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 10px 16px;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(56,91,248,.07);transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(56,91,248,.16)}
.tcard .tav{width:78px;height:78px;border-radius:50%;margin:0 auto 10px;padding:3px;border:1.5px solid var(--blue);background:#fff;overflow:hidden}
.tcard .tav>*{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.tcard b{display:block;font:700 14.5px var(--f);letter-spacing:-.2px}
.tcard span{display:block;font:400 12px var(--f);color:var(--muted);margin-top:3px;line-height:1.35}
.nf{padding:80px 22px;font:500 15px var(--f)}

/* =================== Sistema de diseño Chekin =================== */
.mi{width:12px;height:12px;vertical-align:-2px;margin-right:4px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{filter:none}
/* pantallas de producto (panel y perfil): fondo casi blanco, sombras azuladas, esquinas de 8–14 px */
body:has(.me-wrap),body:has(.col.wide){background:#FDFDFF}
body.mode-login{background:linear-gradient(180deg,#002CFA 0%,#274BF0 100%) fixed}
.panel,.rcard,.me-prof,.me-lead,.me-pwbox,.me-tm,.kpi,.tcard{border-radius:14px;box-shadow:0 0 5px rgba(26,148,255,.173)}
.panel.blue{box-shadow:0 0 5px rgba(26,148,255,.173)}
.sheet{border-radius:16px 16px 0 0}.modal.center .sheet{border-radius:16px}

.btn,.go,.wb{border-radius:12px}.btn.sm{border-radius:8px}
.me-btn{border-radius:12px;background:#385BF8;box-shadow:none}
.chip{border-radius:8px}.tchip{border-radius:10px}.solcard .soon{border-radius:6px}
.tabs{border-radius:12px;padding:4px}.tabs button{border-radius:8px}

.langSel .ls-cur{border-radius:12px}.langBtn{border-radius:12px}
.me-av .cam{border-color:#fff}
/* campos */
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=url],input[type=number],input[type=password],select,.me-field input,.me-bar select{border-radius:8px;border:1px solid rgba(22,22,67,.2);background-color:#F4F6F8;color:#161643}
input.filled,select.filled,.me-field input.filled{background-color:#fff;border-color:#161643}
.lf.light input[type=text],.lf.light input[type=tel],.lf.light input[type=email],.lf.light input[type=number]{border-radius:8px;border:1px solid rgba(22,22,67,.2);background:#F4F6F8}
.lf.light input.filled{background:#fff;border-color:#161643}
.lf input[type=text],.lf input[type=tel],.lf input[type=email],.lf input[type=number]{border-radius:8px}
.err,.me-err{color:#FF2467}
/* aro de enfoque en todo lo interactivo */
button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,.item .head:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(56,91,248,.2)}
input:focus,select:focus,.me-field input:focus,.me-bar select:focus{outline:0;border-color:#161643;box-shadow:0 0 0 3px rgba(56,91,248,.2)}
.item.primary input:focus,.item.primary select:focus,.lf input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.lf.light input:focus{border-color:#161643;box-shadow:0 0 0 3px rgba(56,91,248,.2)}
/* desactivado = opacidad 0.3; hover/pulsado = capa, sin sombra ni movimiento */
button:disabled,.btn[disabled],.me-btn[disabled],.wb.off{opacity:.3;cursor:not-allowed}
.btn.primary:hover,.me-btn:hover,.go.blue:hover{background-image:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.1))}
.btn.primary:active,.me-btn:active,.go.blue:active{background-image:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1))}
.btn:not(.primary):hover,.langSel .ls-cur:hover,.langBtn:hover,.tabs button:not(.on):hover,.solcard:hover{background-image:linear-gradient(rgba(56,91,248,.06),rgba(56,91,248,.06))}
.item.primary:hover{background-image:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.1)),linear-gradient(180deg,#002CFA 0%,#274BF0 100%)}
.item:not(.primary):hover{background-image:linear-gradient(rgba(56,91,248,.05),rgba(56,91,248,.05))}
.tcard:hover{transform:none;box-shadow:0 0 5px rgba(26,148,255,.173)}
/* tarjeta y QR del cliente: banda superior con el degradado azul de marca, resto plano */
.cband{margin:0 calc(50% - 50vw);background:linear-gradient(180deg,#002CFA 0%,#274BF0 100%);position:relative;display:flex;flex-direction:column;align-items:center;padding-top:clamp(18px,3.4dvh,40px)}
.cband .logo,.col.cl .cband .logo,.col.qr .cband .logo{position:static;top:0;margin:0 auto;height:26px;width:auto}
.col.cl{--av:clamp(64px,9.5dvh,82px)}
@media(min-height:700px){.col.cl{--av:clamp(76px,12.5dvh,128px)}}
.col.cl .cband .avatar,.cband .avatar{width:var(--av);height:var(--av);margin:clamp(14px,2.6dvh,30px) auto calc(var(--av) / -2);padding:0;border:4px solid #fff;background:#fff;box-shadow:0 0 5px rgba(26,148,255,.173);z-index:2}
.cband .avatar::before,.cband .avatar::after{inset:-4px;border:1.5px solid rgba(255,255,255,.7)}
.col.cl .name{margin-top:calc(var(--av) / 2 + clamp(8px,1.4dvh,16px))}
.cband.slim{padding:clamp(20px,4dvh,44px) 0}
.langSel.cl-lang{z-index:5}
.cl-lang .ls-cur{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);color:#fff}
.cl-lang .ls-cur:hover{background-image:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.1))}
.item{background:#fff;border:1px solid #DEDEEB;box-shadow:0 0 5px rgba(26,148,255,.173)}
.item.primary{box-shadow:0 0 5px rgba(26,148,255,.173)}
.head .ic{box-shadow:none}
.qrcard,.col.qr .qrcard{box-shadow:0 0 5px rgba(26,148,255,.173),0 0 0 1px #DEDEEB}
.tag1{letter-spacing:-.4px}.qhead{letter-spacing:-.4px}
.ahead h1,.me-h1{letter-spacing:-.3px}
.pcells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}.pcell,.pcell.has{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}.pcell>b{flex:0 0 100%;min-width:0;margin:0}.pcell .btn.sm{flex:0 0 auto;padding:6px 10px}.btn.ico{padding:6px 8px!important}
.me-q .panel>h2{display:none}

function fmtDates(ev){
  if(!ev||!ev.from)return"";

/* Actividad anónima: una línea por acción (abrir, guardar, WhatsApp, email, presentación, demo, compartir) */
const ACT_Q="chekin-act-queue";
let _fa=false;
async function flushAct(){
  if(_fa)return;_fa=true;
  try{
    let q=[];try{q=JSON.parse(localStorage.getItem(ACT_Q)||"[]")}catch(e){}
    const rest=[];
    for(const p of q){try{await sb.req("/rest/v1/rpc/track_activity",{method:"POST",body:p,keepalive:true})}catch(e){if(!(e.status>=400&&e.status<500&&e.status!==429))rest.push(p)}}
    try{localStorage.setItem(ACT_Q,JSON.stringify(rest))}catch(e){}
  }finally{_fa=false}
}
/* actividad anónima de las tarjetas, guardada en la base común. No cuenta lo que hace el equipo con su sesión abierta (pruebas, vista previa). */
function track(action,rep,ev,extra){
  try{
    if(sb.session()||(typeof fromAdmin!=="undefined"&&fromAdmin))return;
    let q=[];try{q=JSON.parse(localStorage.getItem(ACT_Q)||"[]")}catch(e){}
    q.push({p_slug:rep.slug,p_action:action,p_event_id:ev?ev.id:"",p_extra:extra||""});
    try{localStorage.setItem(ACT_Q,JSON.stringify(q.slice(-50)))}catch(e){}
    flushAct();
  }catch(e){}
}

/* vCard 3.0 completa: nombre, empresa, cargo, teléfono, email, web, LinkedIn, FOTO y nota del evento */
function makeVcf(rep,ev,S){
  const li=rep.linkedin||S.linkedin;
  const e=v=>String(v).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,");
  const fold=l=>{let o="";while(l.length>74){o+=l.slice(0,74)+"\r\n ";l=l.slice(74)}return o+l};
  const [fn,...ln]=rep.name.split(" "),ph=(rep.photo||"").match(/^data:image\/jpeg;base64,(.+)$/);
  const L=["BEGIN:VCARD","VERSION:3.0",`N:${e(ln.join(" "))};${e(fn)};;;`,`FN:${e(rep.name)}`,"ORG:Chekin",
    roleOf(rep)&&`TITLE:${e(roleOf(rep))}`,rep.phone&&`TEL;TYPE=CELL,VOICE:${rep.phone}`,isMail(rep.email)&&`EMAIL;TYPE=INTERNET,WORK:${rep.email}`,
    `URL:${S.web}`,li&&"item1.URL:"+li,li&&"item1.X-ABLabel:LinkedIn",ph&&`PHOTO;ENCODING=b;TYPE=JPEG:${ph[1]}`,
    "NOTE:"+e([ev&&t("met")+ev.name,"Chekin Connect"].filter(Boolean).join(" · ")),"REV:"+new Date().toISOString().replace(/[-:]|\.\d+/g,""),"END:VCARD"].filter(Boolean);
  return L.map(fold).join("\r\n")+"\r\n";
}

function makeQR(text){const q=qrcode(0,"H");q.addData(text);q.make();return q}
function qrSvg(text,cls){

function downloadQR(slug){
  const q=makeQR(cliLink(slug)),n=q.getModuleCount(),m=3,px=1200,cell=px/(n+2*m);
  const c=document.createElement("canvas");c.width=c.height=px;const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,px,px);g.fillStyle="#19194B";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(Math.floor((k+m)*cell),Math.floor((r+m)*cell),Math.ceil(cell),Math.ceil(cell));
  const s=px*.2,x=(px-s)/2,rad=s*.22;
  g.fillStyle="#fff";g.beginPath();g.roundRect(x-12,x-12,s+24,s+24,rad+8);g.fill();
  const img=new Image();img.onload=()=>{
    g.save();g.beginPath();g.roundRect(x,x,s,s,rad);g.clip();g.drawImage(img,x,x,s,s);g.restore();
    c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="qr-"+slug+".png";document.body.appendChild(a);a.click();a.remove()},"image/png");
  };img.src=ICON;
}

async function flushLeads(){
  if(_flushing)return;_flushing=true;

    const q=leadQueue();if(!q.length)return;const rest=[];
    for(const it of q){
      try{await sb.req("/rest/v1/rpc/submit_lead",{method:"POST",body:it.p,keepalive:true})}

    }

}

/* titular tipo web: escribe letra por letra Potencia / Monetiza / Automatiza */
function typeVerb(){const L=DICT[LANG].verbs,v=$("#verb");
  if(!v)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){v.textContent=L[0];return}
  let i=0,n=0,del=false;
  const step=()=>{const w=L[i];
    if(!del){n++;v.textContent=w.slice(0,n);if(n===w.length){del=true;window._typeTimer=setTimeout(step,1900);return}window._typeTimer=setTimeout(step,95)}
    else{n--;v.textContent=w.slice(0,n);if(n===0){del=false;i=(i+1)%L.length;window._typeTimer=setTimeout(step,350);return}window._typeTimer=setTimeout(step,45)}};step();
}

/* "Ver presentación": el cliente elige su tipo de negocio y se abre directamente su página de chekin.com */
/* Presentaciones de Chekin (HTML) por tipo de negocio e idioma, guardadas en /presentaciones/.
   Orden: enlace que se ponga a mano en el panel > presentación en el idioma de la tarjeta > en inglés > página web.
   Pendiente de recibir: apartamentos/villas (vacation rental) e italiano. */
const PRES_DIR="presentaciones/";
/* cada presentación es un único archivo con todos los idiomas dentro (se elige con #es, #en…); el italiano de Hoteles es un archivo aparte */
const PRES={hotel:{file:"hotels.html",langs:["es","en","pt","fr","de"],extra:{it:"hotels-it.html"}},vacation:{file:"vacation-rental.html",langs:["es","en","pt","fr","de"],extra:{}}};
const PRES_LANGS=["es","en","it","pt","fr","de"];
const presFor=(ty,l)=>{const d=PRES[PRES_OF[ty]];if(!d)return null;return d.langs.includes(l)?d.file+"#"+l:(d.extra[l]||null)};
const PRES_OF={vacation:"vacation",villa:"vacation",hotel:"hotel"};
const WEB_FALLBACK={vacation:"https://chekin.com/apartamentos/",villa:"https://chekin.com/villas/",hotel:"https://chekin.com/hoteles/",camping:"https://chekin.com/campings/",other:""};
function deckUrl(ty,S){
  const custom=S.decks&&S.decks[ty];if(custom)return custom;
  const d=PRES[PRES_OF[ty]];
  if(d)return baseUrl().replace(/[^\/]*$/,"")+PRES_DIR+(presFor(ty,LANG)||d.file+"#en");   /* sin su idioma: en inglés */
  return WEB_FALLBACK[ty]||S.deck||S.web;
}
/* de momento solo se muestran los tipos que ya tienen presentación (hoy: Hoteles); el resto se añade cuando lleguen */
const hasDeck=(ty,S)=>!!((S.decks&&S.decks[ty])||(PRES_OF[ty]&&PRES[PRES_OF[ty]]));

  const cardNow=location.href.split("#")[0];

  m.innerHTML=`<div class="sheet"><div class="grab"></div><button class="x" id="dx" aria-label="close">×</button>
    <h2>${t("deckPick")}</h2><p class="hint" style="margin:0 0 6px">${t("deckPickSub")}</p>
    ${TYPES.map((v,i)=>{
      const has=hasDeck(v,S),inner=`<span class="ic"><svg class="i2"><use href="#${tIcons[v]}"/></svg></span><span class="lb2">${esc(DICT[LANG].typeLabels[i])}${LANG==="es"&&heads[v]&&has?`<small>${esc(heads[v])}</small>`:""}</span>`;
      return has?`<a class="solcard" data-ty="${v}" href="${esc(link(v))}"${mine(v)&&PRES_OF[v]&&PRES[PRES_OF[v]]?"":' target="_blank" rel="noopener"'}>${inner}<svg class="chev"><use href="#chev"/></svg></a>`
        :`<div class="solcard off" aria-disabled="true">${inner}<span class="soon">${t("deckSoon")}</span></div>`}).join("")}</div>`;

  $$("[data-ty]",m).forEach(a=>a.addEventListener("click",()=>{track("deck",rep,ev,a.dataset.ty);if(!getLead(rep.slug)){window._deckPending={rep,ev};try{sessionStorage.setItem("chekin-deck-"+rep.slug,"1")}catch(e){}}}));

    <div class="cband"><img class="logo" src="${LOGOW}" alt="Chekin">
    <div class="avatar">${rep.photo?`<img src="${esc(rep.photo)}" alt="">`:AVATAR}</div></div>
    <div class="name">${esc(rep.name)}</div><div class="role">${esc([roleOf(rep),"Chekin"].filter(Boolean).join(" · "))}</div>
    <i class="sp s2"></i><div class="hero">${arcSvg("mp2",true)}<div class="tag1"><span class="line1"><span class="verb" id="verb"></span><span class="caret"></span> <span>${t("tailA")}</span></span><span class="tail">${t("tailB")}</span></div></div>
    <i class="sp s3"></i><div class="list big">
      <div class="item primary" data-grp="c"><button class="head">${ic("i-chat")}<span class="lb">${t("writeMe")}</span>${chev}</button>
        <div class="pan"><div><div class="in" id="writeBody"></div></div></div></div>
      <div class="item" data-grp="c"><button class="head" id="saveVcf">${ic("i-card")}<span class="lb">${t("save")}</span></button></div>
      <div class="item" data-grp="c"><button class="head" id="deckBtn">${ic("i-doc")}<span class="lb">${t("deck")}</span>${chev}</button></div>
      <div class="item" data-grp="c"><button class="head" id="lCal">${ic("i-cal")}<span class="lb">${t("book")}</span></button></div>
    </div><i class="sp s4"></i><p class="foot">Chekin Connect</p></div>`;
  bindLang();
  $("#deckBtn").onclick=()=>openDeck(rep,ev);

  /* «Escríbeme»: primero sus datos (una sola vez), después WhatsApp o email ya escritos con su nombre */
  const hasWA=!!waLink(rep,ev),hasML=!!mailLink(rep,ev);
  function renderWrite(){
    const L=getLead(slug),box=$("#writeBody");
    if(L){
      const wa=waLink(rep,ev,L),ml=mailLink(rep,ev,L);
      box.innerHTML=`<div class="wbtns">
        ${wa?`<a class="wb" id="wa" href="${esc(wa)}" target="_blank" rel="noopener">${sv("i-chat")}WhatsApp</a>`:`<span class="wb off">${sv("i-chat")}WhatsApp</span>`}
        ${ml?`<a class="wb" id="ml" href="${esc(ml)}">${sv("i-mail")}Email</a>`:`<span class="wb off">${sv("i-mail")}Email</span>`}
      </div>${!wa&&!ml?`<p class="hint2">${t("noChannel")}</p>`:`<p class="msgprev"><b>${t("msgReady")}</b><span>“${esc(outMsg(rep,ev,wa?"wa":"mail",L))}”</span></p>`}
      <p class="hint2 lf-who">${t("lfYou",{n:esc(L.first+" "+L.last)})} · <a href="#" id="lfEdit">${t("change")}</a></p>`;
      if($("#wa"))$("#wa").addEventListener("click",()=>track("wa",rep,ev));
      if($("#ml"))$("#ml").addEventListener("click",()=>track("mail",rep,ev));
      $("#lfEdit").onclick=e=>{e.preventDefault();try{const s=leadStore();if(s&&s.consent){delete s.consent[slug];localStorage.setItem(LEAD_KEY,JSON.stringify(s))}}catch(x){}renderWrite()};
      return;
    }
    const btns=(hasWA||hasML)
      ?`<div class="wbtns">
          <button type="button" class="wb ${hasWA?"":"off"}" id="lfWA">${sv("i-chat")}WhatsApp</button>
          <button type="button" class="wb ${hasML?"":"off"}" id="lfML">${sv("i-mail")}Email</button></div>${!hasWA?`<p class="hint2">${t("lfNoWA",{r:esc(first)})}</p>`:""}`

    const f=$("#lfC");
    const go=kind=>{
      const r=readLead(f);if(!r.ok){f.querySelector(".lf-err").textContent=t(r.err);return}

      sendLead(rep,ev,r.data,kind==="wa"?"whatsapp":kind==="ml"?"email":"card");
      if(kind==="wa")window.open(waLink(rep,ev,r.data),"_blank");
      else if(kind==="ml")location.href=mailLink(rep,ev,r.data);
      if(kind==="wa")track("wa",rep,ev);else if(kind==="ml")track("mail",rep,ev);

  };

  /* de vuelta de la presentación (?from=deck, o con el botón «atrás»): si no dejó sus datos se los pedimos; «Reservar demo» abre su agenda */
  if(!refreshed&&!window._pd){
    let back=params.get("from")==="deck",flag=false;try{flag=!!sessionStorage.getItem("chekin-deck-"+slug);sessionStorage.removeItem("chekin-deck-"+slug)}catch(e){}

  }

    const pd=window._pd;if(!pd||pd.slug!==slug)return;window._pd=null;window._deckPending=null;
    setTimeout(()=>{
      if($(".modal")||params.get("c")!==slug)return;
      if(pd.go==="demo"&&cal)openLeadSheet(rep,ev,cal,first);else openDeckLead(rep,ev);
    },300);
  };
  if(window._pd&&window._pd.slug===slug){if(refreshed||slug in PROFILES)runPD();else setTimeout(runPD,1800)}   /* si la base no responde, se abre igualmente */

  /* datos al día: nombre, teléfono, email, Calendly y foto del Account Executive vienen de la base de datos */
  /* si el cliente ya ha abierto algo (o está escribiendo), no se vuelve a pintar: perdería lo escrito. Los datos nuevos se aplican en la siguiente apertura. */
  if(!refreshed&&(!(slug in PROFILES)||!(slug in CUR)))Promise.all([loadProfile(slug),loadCurrentEvent(slug)]).then(([p])=>{if((p||slug in CUR)&&params.get("c")===slug&&!$(".item.open")&&!$(".modal"))viewClient(slug,true)});
}

/* ---------- escáner de tarjetas: el AE fotografía la tarjeta de visita de un contacto ----------
   El texto se lee en el propio móvil (Tesseract.js, se descarga la primera vez que se usa) y el AE revisa los datos antes de guardar. */
const OCR_SRC="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const SCAN_COUNTRIES=["Spain","Italy","Portugal","France","Germany","United Kingdom","Greece","Croatia","Austria","Switzerland","Netherlands","Belgium","Ireland","Bulgaria","Hungary","Czech Republic","Poland","Romania","Andorra","Morocco","United Arab Emirates","Mexico","Argentina","Colombia","Chile","Brazil","United States"];
const PHONE_COUNTRY=[["+351","Portugal"],["+385","Croatia"],["+359","Bulgaria"],["+420","Czech Republic"],["+353","Ireland"],["+376","Andorra"],["+212","Morocco"],["+971","United Arab Emirates"],["+34","Spain"],["+39","Italy"],["+33","France"],["+49","Germany"],["+44","United Kingdom"],["+30","Greece"],["+43","Austria"],["+41","Switzerland"],["+31","Netherlands"],["+32","Belgium"],["+36","Hungary"],["+48","Poland"],["+40","Romania"],["+52","Mexico"],["+54","Argentina"],["+57","Colombia"],["+56","Chile"],["+55","Brazil"],["+1","United States"]];
const TLD_COUNTRY={es:"Spain",it:"Italy",pt:"Portugal",fr:"France",de:"Germany",uk:"United Kingdom",gr:"Greece",hr:"Croatia",at:"Austria",ch:"Switzerland",nl:"Netherlands",be:"Belgium",ie:"Ireland",bg:"Bulgaria",hu:"Hungary",cz:"Czech Republic",pl:"Poland",ro:"Romania",ad:"Andorra",ma:"Morocco",ae:"United Arab Emirates",mx:"Mexico",ar:"Argentina",cl:"Chile",br:"Brazil"};
const FREE_MAIL=/^(gmail|googlemail|hotmail|outlook|live|yahoo|icloud|me|msn|aol|proton|protonmail|gmx|libero|orange|wanadoo|telefonica|movistar)\./i;
const CO_RX=/\b(s\.?\s?l\.?u?|s\.?\s?a\.?u?|s\.?r\.?l\.?|s\.?p\.?a\.?|ltd|limited|llc|inc|gmbh|sas|sarl|lda|group|grupo|hotel(es|s)?|resort|apartament(os|s)?|apartments?|villas?|rentals?|homes|suites|hostel|camping|properties|inmobiliaria|management)\b/i;
const ROLE_RX=/\b(ceo|cto|cfo|coo|founder|co-?founder|fundador(a)?|director(a)?|manager|gerente|responsable|head|jef[ea]|owner|propietari[oa]|soci[oa]|partner|sales|ventas|marketing|comercial|revenue|operations|operaciones|account|executive|consultant|consultor(a)?|recepci[oó]n|reception|front office|general)\b/i;
const COMPOUND=/^(luis|jose|maria|carlos|antonio|manuel|miguel|angel|jesus|javier|ignacio|francisco|pablo|alberto|andres|ramon|enrique|isabel|carmen|elena|teresa|luisa|pilar|dolores|victoria|cristina|eugenia|paz|mar|sol|rosa|ana|juan)$/;
let ocrLib=null;
function loadOcr(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(!ocrLib)ocrLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src=OCR_SRC;s.async=true;s.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error("ocr"));s.onerror=()=>{ocrLib=null;rej(new Error("ocr"))};document.head.appendChild(s)});
  return ocrLib;
}
async function cardCanvas(file){   /* foto reducida y en escala de grises: lee mejor y más rápido */
  const im=await loadImage(file),k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),px=d.data;
  for(let i=0;i<px.length;i+=4){const g=.299*px[i]+.587*px[i+1]+.114*px[i+2];px[i]=px[i+1]=px[i+2]=g}
  x.putImageData(d,0,0);return c;
}
/* lector principal: Claude (función scan-card en Supabase). Si no responde, se usa el lector del móvil de abajo. */
async function readCardClaude(file){
  const im=await loadImage(file),k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  const image=c.toDataURL("image/jpeg",.85).split(",")[1];
  const d=await sb.authed("/functions/v1/scan-card",{method:"POST",body:{image,media_type:"image/jpeg"}});
  if(!d||typeof d!=="object"||d.error)throw new Error((d&&d.error)||"scan");
  return{first:d.first_name||"",last:d.last_name||"",company:d.company||"",phone:normPhone(d.phone||""),email:(d.email||"").toLowerCase(),country:d.country||countryOf(normPhone(d.phone||""),(d.email||"").split("@")[1]||d.website||"")};
}
async function readCard(file,onProg){
  const [T,c]=await Promise.all([loadOcr(),cardCanvas(file)]);
  const r=await T.recognize(c,"eng+spa",{logger:m=>{if(m&&m.status==="recognizing text")onProg(Math.round((m.progress||0)*100))}});
  return (r&&r.data&&r.data.text)||"";
}
function countryOf(phone,mailOrWeb){
  const ph=String(phone||"").replace(/\s/g,"");
  for(const [pre,c] of PHONE_COUNTRY)if(ph.startsWith(pre))return c;
  const tld=String(mailOrWeb||"").toLowerCase().split(".").pop();
  return TLD_COUNTRY[tld]||"";
}
/* de texto suelto a campos: email y teléfono por patrón; empresa por forma jurídica o dominio; nombre = línea corta sin cargo ni empresa */
function parseCard(text){
  const lines=String(text||"").split(/\n+/).map(s=>s.replace(/[|_~•·]+/g," ").replace(/\s+/g," ").trim()).filter(s=>s.length>1);
  const all=lines.join("\n");
  const email=((all.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/)||[""])[0]).toLowerCase();
  /* teléfono: el que lleva delante M./Móvil/Mobile gana (fijo y móvil suelen ir en la misma línea); si no hay, el primero */
  let phone="",mobile="";
  for(const l of lines){
    if(l.includes("@"))continue;
    const rx=/(?:\+|00)?\d[\d\s().\/-]{7,}\d/g;let m;
    while((m=rx.exec(l))){
      const n=m[0].replace(/\D/g,"").length;if(n<9||n>15)continue;
      const p=normPhone(m[0].replace(/[\/]/g," ")),before=l.slice(Math.max(0,m.index-12),m.index);
      if(/(^|[^\p{L}])(m|mob|movil|móvil|cell|cel|mobile|whatsapp)\.?\s*:?\s*$/iu.test(before)){if(!mobile)mobile=p}
      else if(!phone)phone=p;
    }
  }
  phone=mobile||phone;
  const web=(all.match(/(?:www\.)?([a-z0-9-]+\.(?:com|es|it|pt|fr|de|net|org|eu|co\.uk|io|travel))\b/i)||[])[1]||"";
  const domain=email?email.split("@")[1]:"";
  let company=lines.find(l=>CO_RX.test(l)&&!l.includes("@")&&!/www\.|\d{4,}/i.test(l))||"";
  company=company.replace(/[*®™©]+/g,"").replace(/^(?:\p{L}\s+)+/u,"").replace(/\s+/g," ").trim();   /* «a GRAN HOTEL ALMAR* & Spa*» → «GRAN HOTEL ALMAR & Spa» */
  if(!company){const base=(domain&&!FREE_MAIL.test(domain))?domain:web;if(base)company=base.split(".")[0].replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase())}
  const plain=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  /* restos del lector (logos, adornos) pegados al nombre: «EE Marta Ruiz» → «Marta Ruiz» */
  const PART=/^(de|del|da|das|do|dos|di|la|le|van|von|y|e)$/i;
  const junk=w=>!PART.test(w)&&((w.replace(/[^\p{L}]/gu,"").length<3&&w===w.toUpperCase())||!/[aeiouyáéíóúàèìòùâêîôûäëïöü]/i.test(w));
  const clean=l=>{const w=l.split(" ");while(w.length&&junk(w[0]))w.shift();while(w.length&&junk(w[w.length-1]))w.pop();return w.join(" ")};
  const nameish=l=>l!==company&&!/[\d@:\/]/.test(l)&&!/www|\.com/i.test(l)&&!ROLE_RX.test(plain(l))&&!CO_RX.test(l)&&/^[\p{L}'’.-]+(?: [\p{L}'’.-]+){1,3}$/u.test(l);
  const cand=lines.map(clean).filter(nameish);
  let name=cand[0]||"";
  if(email){const lp=plain(email.split("@")[0]).replace(/[^a-z]/g,"");const hit=cand.find(l=>plain(l).split(" ").some(w=>w.length>2&&lp.includes(w)));if(hit)name=hit}
  if(name&&name===name.toUpperCase())name=name.toLowerCase().replace(/(^|[\s'’-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
  const parts=name.split(" ").filter(Boolean);
  /* nombre compuesto (José Luis, María José…): por la lista de segundos nombres habituales o porque el email los lleva juntos (joseluis.perez@) */
  const lp1=email?plain(email.split("@")[0]).split(/[._-]/)[0]:"";
  const two=parts.length>=3&&(COMPOUND.test(plain(parts[1]))||(lp1&&lp1===plain(parts[0]+parts[1])));
  const nf=two?2:1;
  return{first:parts.slice(0,nf).join(" "),last:parts.slice(nf).join(" "),company,phone,email,country:countryOf(phone,domain||web)};
}
function scanInit(box,getEv,onSaved){

    $("#scFile",box).onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)form(f)};
  };
  const form=file=>{
    const url=file?URL.createObjectURL(file):"";
    const fld=(id,name,label,extra="")=>`<div class="me-field"><label for="${id}">${label}</label><input id="${id}" name="${name}" autocomplete="off" ${extra}></div>`;
    box.innerHTML=`<form class="me-scan-box" novalidate><h3>${t("scanTitle")}</h3>
      ${file?`<img class="me-scan-img" src="${esc(url)}" alt="">`:""}

      <div class="me-row2">${fld("scFirst","first",t("lfFirst"))}${fld("scLast","last",t("lfLast"))}</div>
      ${fld("scCo","company",t("scanCompany"))}
      ${fld("scPhone","phone",t("lfPhone"),'type="tel" inputmode="tel"')}
      ${fld("scMail","email",t("lfMail"),'type="email" inputmode="email" autocapitalize="none"')}
      ${fld("scCountry","country",t("scanCountry"),'list="scCountries"')}<datalist id="scCountries">${SCAN_COUNTRIES.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
      ${fld("scProps","props",t("scanProps"),'type="number" inputmode="numeric" min="0" max="100000" step="1"')}
      <div class="me-field"><label for="scNotes">${t("scanComments")}</label><textarea id="scNotes" name="notes" maxlength="1000"></textarea></div>
      <label class="me-check"><input type="checkbox" name="card"><span>${t("scanCard")}</span></label>
      <p class="me-err" id="scErr" role="alert"></p>
      <div class="me-scan-a"><button class="me-btn ghost" type="button" id="scCancel">${t("cancel")}</button><button class="me-btn" type="submit" id="scSave">${t("scanSave")}</button></div>
      ${file?`<button class="me-link" type="button" id="scAgain">${t("scanRetake")}</button>`:""}
    </form>`;
    const f=$("form",box),E=f.elements,st=$("#scSt",box);let alive=true;
    const close=()=>{alive=false;if(url)URL.revokeObjectURL(url);idle()};
    const put=(n,v)=>{if(v&&!E[n].value){E[n].value=v;E[n].classList.add("filled")}};
    $("#scCancel",box).onclick=close;
    E.phone.addEventListener("change",()=>put("country",countryOf(normPhone(E.phone.value),E.email.value.split("@")[1])));
    if(file){
      $("#scAgain",box).onclick=()=>{close();$("#scFile",box).click()};
      st.textContent=t("scanAi");
      readCardClaude(file)
        .catch(()=>{if(alive)st.textContent=t("scanLoading");return readCard(file,p=>{if(alive)st.textContent=t("scanReading",{p})}).then(parseCard)})
        .then(d=>{
          if(!alive)return;
          ["first","last","company","phone","email","country"].forEach(k=>put(k,d[k]));
          st.textContent=(d.first||d.email||d.phone)?t("scanDone"):t("scanFail");
        }).catch(()=>{if(alive)st.textContent=t("scanFail")});
    }else E.first.focus();
    f.onsubmit=async ev=>{
      ev.preventDefault();const err=$("#scErr",box);err.textContent="";
      const first=E.first.value.trim(),email=E.email.value.trim().toLowerCase(),phone=normPhone(E.phone.value),pr=E.props.value.trim();

      if(!email&&!phone){err.textContent=t("scanErrContact");return}
      if(email&&!mailOK(email)){err.textContent=t("meErrMail");return}
      if(phone&&phone.replace(/\D/g,"").length<7){err.textContent=t("scanErrPhone");return}
      if(pr&&!/^\d{1,6}$/.test(pr)){err.textContent=t("scanErrProps");return}
      if(!E.card.checked){err.textContent=t("scanErrCard");return}
      const btn=$("#scSave",box),ev2=getEv()||null;btn.disabled=true;
      try{
        await sb.authed("/rest/v1/rpc/add_scanned_lead",{method:"POST",body:{p_first:first,p_last:E.last.value.trim(),p_company:E.company.value.trim(),p_phone:phone,p_email:email,p_country:E.country.value.trim(),p_properties:pr?Number(pr):null,p_comments:E.notes.value.trim(),p_card_given:true,p_event_name:ev2?ev2.name||"":"",p_event_city:ev2?ev2.city||"":"",p_lang:LANG}});
        toast(t("scanOk"));close();onSaved();
      }catch(x){
        btn.disabled=false;const m=String(x&&x.message||"");
        err.textContent=/invalid_email/.test(m)?t("meErrMail"):/invalid_phone/.test(m)?t("scanErrPhone"):/contact_required/.test(m)?t("scanErrContact"):/invalid_name/.test(m)?t("scanErrName"):/card_required/.test(m)?t("scanErrCard"):meErrText(x);
      }
    };
  };
  idle();
}

async function meAe(){
  const p=ME,r=meRepOf(p),photo=photoUrl(p);
  document.body.className="";
  app.innerHTML=`<div class="me-wrap">${meTop()}
    <div class="me-prof">
      <div class="me-ph"><button type="button" class="me-av" id="mePh" aria-label="${t("mePhoto")}">${photo?`<img src="${esc(photo)}" alt="">`:AVATAR}<span class="cam">${ME_CAM}</span></button>
        <div><div class="me-name">${esc(p.name)}</div><div class="me-role">${esc(p.title)} · Chekin</div><button type="button" class="me-link" id="mePh2">${t("mePhoto")}</button></div></div>
      <input type="file" id="meFile" accept="image/*" hidden>
      <form id="meProf" novalidate>
        <div class="me-field"><label for="mePhone">${t("mePhone")}</label><input id="mePhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(p.phone)}" placeholder="+34 600 000 000"><p class="me-hint">${t("mePhoneHint")}</p></div>
        <div class="me-field"><label for="meMail">${t("meMail")}</label><input id="meMail" name="mail" type="email" inputmode="email" value="${esc(p.contact_email||p.email)}"><p class="me-hint">${t("meMailHint")}</p></div>
        <div class="me-field"><label for="meCal">${t("meCal")}</label><input id="meCal" name="cal" type="url" inputmode="url" value="${esc(p.calendly_url)}" placeholder="https://calendly.com/tu-nombre"><p class="me-hint">${t("meCalHint")}</p></div>
        <p class="me-err" id="meProfErr" role="alert"></p>
        <button class="me-btn" type="submit">${t("meSaveProfile")}</button>
      </form>
    </div>
    <p class="me-ev" id="meEv">…</p>
    <div class="me-links"><a class="btn sm" href="${esc(cliLinkFor(r))}" target="_blank" rel="noopener">${t("meCard")}</a><a class="btn sm" href="${esc(repLinkFor(r))}" target="_blank" rel="noopener">${t("meQR")}</a></div>
    <div class="me-scan" id="meScan"></div>
    <h2 class="me-h">${t("meLeads")} <span id="meCount"></span></h2><div id="meLeads"><p class="me-hint">…</p></div>
    <details class="me-pwbox"><summary>${t("mePwTitle")}</summary>${pwFormHTML()}</details>
  </div>`;
  meBindTop();
  let scanEv=null;
  loadCurrentEvent(p.slug).then(e=>{scanEv=e||null;const el=$("#meEv");if(el)el.innerHTML=e?t("meEvNow",{n:"<b>"+esc(e.name)+"</b>"+(e.city?" · "+esc(e.city):"")}):(e===null?t("meEvNone"):"")});
  $("#mePh").onclick=$("#mePh2").onclick=()=>$("#meFile").click();
  $("#meFile").onchange=async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;toast(t("mePhotoUp"));
    try{await uploadPhoto(file);toast(t("mePhotoOk"));meAe()}catch(x){toast(t("mePhotoErr"))}
  };
  const f=$("#meProf");
  f.onsubmit=async ev=>{
    ev.preventDefault();const err=$("#meProfErr");err.textContent="";
    const phone=normPhone(f.elements.phone.value),mail=f.elements.mail.value.trim(),cal=f.elements.cal.value.trim();
    if(phone&&phone.replace(/\D/g,"").length<9){err.textContent=t("meErrPhone");return}
    if(mail&&!mailOK(mail)){err.textContent=t("meErrMail");return}
    if(cal&&!/^https:\/\/[^\s/]+\.[^\s]+$/i.test(cal)){err.textContent=t("meErrCal");return}
    const btn=$("button[type=submit]",f);btn.disabled=true;
    try{
      const rows=await sb.authed("/rest/v1/profiles?id=eq."+encodeURIComponent(ME.id),{method:"PATCH",body:{phone,contact_email:mail,calendly_url:cal},headers:{Prefer:"return=representation"}});
      ME=(rows&&rows[0])||{...ME,phone,contact_email:mail,calendly_url:cal};f.elements.phone.value=ME.phone;toast(t("meSaved"));
    }catch(x){err.textContent=meErrText(x)}
    btn.disabled=false;
  };
  bindPw($(".me-pwbox"),()=>{$(".me-pwbox").open=false;$(".me-pwform").reset()});
  const loadLeads=async()=>{
    try{
      const rows=await sb.authed("/rest/v1/leads?select=*&order=created_at.desc&limit=500");
      $("#meCount").textContent=rows.length?"("+rows.length+")":"";
      $("#meLeads").innerHTML=rows.length?rows.map(l=>leadCard(l)).join(""):`<p class="me-hint">${t("meNoLeads")}</p>`;
    }catch(x){if($("#meLeads"))$("#meLeads").innerHTML=`<p class="me-err">${meErrText(x)}</p>`}
  };
  scanInit($("#meScan"),()=>scanEv,loadLeads);
  await loadLeads();
}

/* ---------- administración ---------- */
async function meAdmin(){
  document.body.className="";
  app.innerHTML=`<div class="me-wrap wide">${meTop()}<h1 class="me-h1">${t("meAdminTitle")}</h1><p class="me-hint" id="meAdminSub">…</p><div class="me-scan" id="meScan" style="max-width:560px"></div><div id="meAdminBody"></div>
    <details class="me-pwbox"><summary>${t("mePwTitle")}</summary>${pwFormHTML()}</details></div>`;
  meBindTop();bindPw($(".me-pwbox"),()=>{$(".me-pwbox").open=false;$(".me-pwform").reset()});
  scanInit($("#meScan"),()=>null,meAdmin);   /* Growth también puede escanear tarjetas en los eventos */
  let leads=[],profs=[],evs=[];
  try{[leads,profs,evs]=await Promise.all([sb.authed("/rest/v1/leads?select=*&order=created_at.desc&limit=2000"),sb.authed("/rest/v1/profiles?select=*&order=name.asc"),sb.authed("/rest/v1/events?select=name,kind").catch(()=>[])])}
  catch(x){$("#meAdminSub").textContent=meErrText(x);return}
  const aes=profs.filter(q=>q.role==="ae"),names={};profs.forEach(q=>names[q.id]=q.name);
  let filter="all";
  const draw=()=>{
    const rows=filter==="all"?leads:leads.filter(l=>l.ae_id===filter);
    $("#meAdminSub").textContent=t("meCount",{n:rows.length});
    $("#meAdminBody").innerHTML=`<div class="me-bar"><select id="meFilter" aria-label="${t("meAll")}"><option value="all">${t("meAll")} (${leads.length})</option>${aes.map(a=>`<option value="${esc(a.id)}" ${filter===a.id?"selected":""}>${esc(a.name)} (${leads.filter(l=>l.ae_id===a.id).length})</option>`).join("")}</select>
      <button class="btn sm primary" id="meCsv" type="button" ${rows.length?"":"disabled"}>${t("meExport")}</button><a class="btn sm" href="${esc(baseUrl())}">${t("mePanel")}</a></div>
      <div class="me-q"><h2 class="me-h">${t("tabEvents")}</h2>${qualityHTML(qualityRows(leads,evs),"event")}<h2 class="me-h">${t("tabWebinars")}</h2>${qualityHTML(qualityRows(leads,evs),"webinar")}</div>
      <div class="me-q">${demosHTML(rows,l=>names[l.ae_id]||l.ae_slug,"meCsvDemos")}</div>
      <div class="me-list">${rows.length?rows.map(l=>leadCard(l,names[l.ae_id]||l.ae_slug)).join(""):`<p class="me-hint">${t("meNoLeadsAdmin")}</p>`}</div>
      <h2 class="me-h">${t("meTeam")}</h2><div class="me-team">${aes.map(a=>`<div class="me-tm"><b>${esc(a.name)}</b>${fillChip(a.phone,t("mePhoneS"))}${fillChip(a.calendly_url,"Calendly")}${fillChip(a.photo_path,t("mePhotoS"))}${a.must_change_password?`<span class="chip pend">${t("mePwPending")}</span>`:""}</div>`).join("")}</div>`;
    $("#meFilter").onchange=e=>{filter=e.target.value;draw()};
    $("#meCsv").onclick=()=>downloadCsv(rows,names);
    const bd=$("#meCsvDemos");if(bd)bd.onclick=()=>downloadCsv(demoLeads(rows),names);
  };
  draw();
}

/* Navegación interna: los enlaces de la propia web (?r= ?c= ?team) se abren dentro de la página.
   Así la vista previa funciona aunque el archivo se abra desde el móvil sin dirección web. */
let fromAdmin=false;
const inView=()=>params.get("c")||params.get("r")||params.has("team");
function nav(q){
  const was=!inView();
  params=new URLSearchParams(q);
  fromAdmin=inView()?(was||fromAdmin):false;
  try{history.pushState({},"","?"+params.toString())}catch(e){}
  route();window.scrollTo(0,0);
}
window.addEventListener("popstate",()=>{params=new URLSearchParams(location.search);if(!inView())fromAdmin=false;route()});
document.addEventListener("click",e=>{
  const a=e.target.closest("a[href]");if(!a)return;
  if(a.target==="_blank")return;const raw=a.getAttribute("href")||"";if(!/^[^#]*[?](c|r|team)(=|$|&)/.test(raw))return;   /* solo enlaces propios con ?c= ?r= ?team */
  const href=a.href||"",here=location.href.split(/[?#]/)[0],base=baseUrl().split(/[?#]/)[0];
  const q=href.slice(href.indexOf("?")).split("#")[0];
  if(href.startsWith(here)||href.startsWith(base)){e.preventDefault();nav(q)}
});
/* campos: vacíos en gris, con contenido en blanco y borde azul oscuro (sistema de diseño) */
const markFilled=()=>$$("input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]):not([type=range]),select,textarea").forEach(e=>e.classList.toggle("filled",!!e.value));
document.addEventListener("input",e=>{const x=e.target;if(x&&x.matches&&x.matches("input,select,textarea"))x.classList.toggle("filled",!!x.value)});
new MutationObserver(()=>{clearTimeout(window._mf);window._mf=setTimeout(markFilled,30)}).observe(document.body,{childList:true,subtree:true});
route();
})();
</script>
