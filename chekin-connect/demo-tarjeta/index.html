<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chekin · Sales card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#375CF6;--navy:#1B1F6B;--ink:#1E1F6B;--muted:#5F689F;--soft:#E3EAFF;--f:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#1B1F6B}
body{font-family:var(--f);font-weight:400;color:var(--ink);min-height:100dvh;text-align:center;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff 0%,#E6EDFF 45%,#C9D8FF 100%) fixed}
body.mode-qr{background:linear-gradient(180deg,#375CF6 0%,#2D45D8 50%,#1B1F6B 100%) fixed;color:#fff}
main{flex:1;display:flex;flex-direction:column}
main>section{flex:1}
.col{position:relative;max-width:400px;margin:0 auto;padding:0 22px 14px}
.hide{display:none!important}

/* barra demo */
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);padding:12px 22px;border-bottom:1px solid var(--blue);display:flex;gap:8px;justify-content:center}
.seg2{display:flex;flex:1;max-width:360px;border:1px solid var(--blue);border-radius:999px;overflow:hidden}
.seg2 button{flex:1;border:0;background:transparent;padding:9px 4px;font:600 12px var(--f);color:var(--blue);cursor:pointer}
.seg2 button.on{background:var(--blue);color:#fff}
.langBtn{border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:999px;padding:0 12px;font:600 12px var(--f);cursor:pointer}
.cl-lang{position:absolute;top:14px;right:22px;padding:6px 12px;display:none}
.embed .cl-lang{display:block}

.logo{display:block;margin:0 auto;height:28px;width:auto;padding-top:0;position:relative;top:14px}
.logo.white{filter:brightness(0) invert(1)}

/* arco + cohete */
.arcbox{position:relative;width:100%;height:84px;margin:34px auto 0}
.arc{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible}

/* PANTALLA QR (todo azul) */
.qrcard{position:relative;margin:8px auto 14px;width:min(78vw,300px,36dvh);aspect-ratio:1;background:#fff;border-radius:26px;padding:14px;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 18px 40px rgba(10,14,80,.35)}
.qrcard svg.qr{width:100%;height:100%;display:block}
.qrlogo{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:20%;border:5px solid #fff;background:#fff}
.scan{font:700 19px var(--f);color:#fff;margin-top:6px;letter-spacing:-.2px}
.evline{font:400 13px var(--f);color:#DCE5FF;margin-top:4px;line-height:1.6}

/* VISTA CLIENTE (fondo claro) */
.avatar{width:clamp(64px,9.5dvh,82px);height:clamp(64px,9.5dvh,82px);border-radius:50%;margin:26px auto 6px;padding:4px;border:1.5px solid var(--blue);background:#fff;box-shadow:0 8px 22px rgba(55,92,246,.2)}
.avatar>*{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.name{font:700 22px var(--f);letter-spacing:-.4px;color:var(--ink)}
.role{font:400 13px var(--f);color:var(--muted);margin-top:2px}
.hero{position:relative;height:88px;margin:14px auto 12px;width:100%}
.tag1{position:absolute;left:0;right:0;top:32px;font:700 25px var(--f);letter-spacing:-.8px;line-height:1.14}
.line1{display:block;min-height:1.14em;color:var(--ink)}
.verb{color:var(--blue)}
.caret{display:inline-block;width:2px;height:.82em;background:var(--blue);margin-left:2px;vertical-align:-.06em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tail{display:block;color:var(--ink)}

/* cuadro azul con las preguntas */
.card{background:linear-gradient(180deg,#375CF6 0%,#2B3FCB 65%,#222FA6 100%);border-radius:26px;padding:20px 18px 18px;color:#fff;text-align:left;box-shadow:0 16px 36px rgba(55,92,246,.35)}
.card h2{font:700 19px var(--f);letter-spacing:-.3px}
.card .sub{font:400 12px var(--f);color:#DCE5FF;margin:2px 0 4px}
label{display:block;font:600 11px var(--f);color:#E8EEFF;margin:12px 0 5px;letter-spacing:.1px}
input,select{width:100%;border:1px solid #fff;border-radius:14px;padding:12px 13px;font:500 15px var(--f);background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#375CF6 50%),linear-gradient(135deg,#375CF6 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus{outline:0;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label:first-child{margin-top:0}
.phone{display:grid;grid-template-columns:112px 1fr;gap:8px}
.prog{display:flex;align-items:center;gap:10px;margin:16px 0 2px;font:500 11px var(--f);color:#DCE5FF}
.bar{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:.25s}
.err{color:#FFD4D0;font:500 11px var(--f);margin:6px 0;min-height:14px}
.go{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:#fff;color:var(--blue);font:700 15px var(--f);cursor:pointer;box-shadow:0 0 0 4px rgba(255,255,255,.22);text-decoration:none;text-align:center}
.ok{text-align:center;padding:8px 0 2px}.ok .big{font-size:32px}.ok b{font:700 19px var(--f);display:block;margin:4px 0}
.ok .sub{display:block;margin:2px 0 6px}
.tag{display:inline-block;border:1px solid #fff;color:#fff;font:600 11px var(--f);padding:3px 12px;border-radius:99px;margin:4px 0 6px}
.cta{margin-top:12px}
.lnk{display:block;margin-top:12px;font:500 13px var(--f);color:#fff;text-decoration:underline;text-align:center}

/* botones-icono (fondo claro) */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;cursor:pointer;color:var(--ink);text-decoration:none;font:600 11px var(--f);padding:0}
.act .ic{width:54px;height:54px;border-radius:50%;background:var(--soft);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(55,92,246,.12)}
.act.off{opacity:.5;cursor:default}
svg.i2{width:20px;height:20px;fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.evrow{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;font:500 12px var(--f);color:var(--muted);line-height:1.5}
.evrow svg.i2{width:16px;height:16px;flex:none}
.foot{margin-top:8px;font:500 12px var(--f);color:var(--muted)}

/* LISTA de filas (acordeón), alineadas de arriba abajo */
.list{display:grid;gap:9px;margin-top:2px;text-align:left}
.item{width:min(100%,276px);margin:0 auto;transition:width .3s ease;border-radius:18px;background:rgba(255,255,255,.82);border:1px solid rgba(55,92,246,.22);overflow:hidden;box-shadow:0 6px 18px rgba(55,92,246,.08)}
.item.open{width:100%}
.item .head{display:flex;align-items:center;gap:12px;width:100%;padding:7px 14px 7px 8px;background:none;border:0;text-align:left;font:600 14.5px var(--f);color:var(--ink);cursor:pointer;text-decoration:none;position:relative}
.head .lb{flex:1;text-align:center}
.item .head:not(:has(.chev))::after{content:"";width:36px;flex:none}
.head .ic{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(55,92,246,.12)}
.chev{width:36px;height:15px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s;flex:none}
.item.open .chev{transform:rotate(90deg)}
.item.off{opacity:.55}.item.off .head{cursor:default}
.item.primary{background:linear-gradient(180deg,#375CF6 0%,#2B3FCB 70%,#222FA6 100%);border-color:transparent;box-shadow:0 14px 30px rgba(55,92,246,.35)}
.item.primary .head{color:#fff}
.item.primary .ic{background:rgba(255,255,255,.2);box-shadow:none}
.item.primary svg.i2{stroke:#fff}.item.primary .chev{stroke:#fff}
.pan{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .pan{grid-template-rows:1fr}
.pan>div{overflow:hidden}
.pan .in{padding:2px 18px 18px;color:var(--ink)}
.item.primary .pan .in{color:#fff}
.in .sub{font:400 12px var(--f);color:#DCE5FF;margin:0 0 4px}
.in.info{font:500 13px var(--f);line-height:1.8;text-align:center}.in.info b{font:700 15px var(--f)}

/* leads (interno) */
.panel{background:#fff;border:1px solid #D5DEFF;border-radius:20px;padding:16px;color:var(--ink);margin-top:34px;text-align:left}.panel h2{font:700 17px var(--f);margin-bottom:2px}
.psub{font:400 11px var(--f);color:var(--muted);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font:400 11px var(--f)}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--blue)}
td{padding:8px 4px;border-bottom:1px solid #DCE3FF;vertical-align:top}
.tiny{background:none;border:0;color:var(--muted);font:400 11px var(--f);text-decoration:underline;cursor:pointer;margin-top:8px}
.demo{font:400 10px var(--f);color:var(--muted);margin-top:14px;line-height:1.5}
</style>
</head>

const segOf=n=>n<=2?"1-2":n<=10?"3-10":"+10";

function buildSelects(){
  const pc=$("pc"),keep=pc.value||"+34";
  pc.innerHTML=PREFIXES.map(([c,p])=>`<option value="${p}">${c} ${p}</option>`).join("");pc.value=keep;
  const pt=$("ptype"),k2=pt.value;
  pt.innerHTML=`<option value="">${t("pPlace")}</option>`+TYPES.map((v,i)=>`<option value="${v}">${DICT[LANG].typeLabels[i]}</option>`).join("");pt.value=k2;
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-rep="name"]').forEach(e=>e.textContent=rep.name);
  document.querySelectorAll('[data-rep="roleFull"]').forEach(e=>e.textContent=rep.role[LANG]+" · Chekin");
  document.querySelectorAll("[data-lang]").forEach(b=>b.textContent=LANG==="es"?"ES · EN":"EN · ES");
  $("evLine").innerHTML=[ev.name,fmtDates()].join(" · ")+"<br>"+ev.loc;
  $("iName").textContent=ev.name;$("iDate").textContent=fmtDates();$("iLoc").textContent="📍 "+ev.loc;
  $("lWeb").href=BASE.links.web;$("lIn").href=BASE.links.linkedin;$("lCal").href=BASE.links.cal||"#";
  $("tailA").textContent=t("tailA");$("tailB").textContent=t("tailB");startType();
  buildSelects();progress();render();if(thanksState)renderThanks();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{LANG=LANG==="es"?"en":"es";set(K.lang,LANG);applyLang()});

/* titular tipo web: escribe letra por letra Monetiza / Automatiza */
let typeTimer;
function startType(){
  clearTimeout(typeTimer);const L=DICT[LANG].verbs,v=$("verb");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){v.textContent=L[0];return}
  let i=0,n=0,del=false;v.textContent="";
  const step=()=>{const w=L[i];
    if(!del){n++;v.textContent=w.slice(0,n);if(n===w.length){del=true;typeTimer=setTimeout(step,1900);return}typeTimer=setTimeout(step,95)}
    else{n--;v.textContent=w.slice(0,n);if(n===0){del=false;i=(i+1)%L.length;typeTimer=setTimeout(step,350);return}typeTimer=setTimeout(step,45)}};
  step();
}

/* QR ficticio (3 marcadores de esquina + logo). Con la web publicada se sustituye por un QR real. */
function paintQR(){
  const N=29,seed0=[...(repId+ev.name+ev.from)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  let s=seed0||1;const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  const m=Array.from({length:N},()=>Array(N).fill(0));
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)m[y][x]=rnd()<.5?1:0;
  const finder=(ox,oy)=>{for(let y=-1;y<=7;y++)for(let x=-1;x<=7;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=N||Y>=N)continue;
    const edge=x===0||x===6||y===0||y===6,core=x>=2&&x<=4&&y>=2&&y<=4;m[Y][X]=(x>=0&&x<=6&&y>=0&&y<=6&&(edge||core))?1:0}};
  finder(0,0);finder(N-7,0);finder(0,N-7);
  for(let i=8;i<N-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0}
  const c=Math.floor(N/2);for(let y=c-4;y<=c+4;y++)for(let x=c-4;x<=c+4;x++)m[y][x]=0;
  let d="";for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])d+=`M${x} ${y}h1v1h-1z`;
  $("qr").innerHTML=`<svg class="qr" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges"><path d="${d}" fill="#1B1F6B"/></svg>`;
}

/* acordeón: una fila abierta a la vez; pulsar la abierta la cierra */
document.addEventListener("click",e=>{
  const h=e.target.closest(".head");if(!h)return;
  const it=h.closest(".item");if(!it||!it.querySelector(".pan")||it.classList.contains("off"))return;
  const was=it.classList.contains("open");
  document.querySelectorAll('.item[data-grp="'+it.dataset.grp+'"]').forEach(x=>x.classList.remove("open"));
  if(!was)it.classList.add("open");
});

function showPhoto(){$("av2").innerHTML=rep.photo?`<img src="${rep.photo}" alt="">`:AVATAR}

function screen(s){
  [["sQR","tQR","qr"],["sCli","tCli","cli"],["sLeads","tLeads","leads"]].forEach(([sec,tab,k])=>{$(sec).classList.toggle("hide",k!==s);$(tab).classList.toggle("on",k===s)});
  document.body.classList.toggle("mode-qr",s==="qr");
  window.scrollTo(0,0);if(s==="leads")render();
}
$("tQR").onclick=()=>screen("qr");$("tCli").onclick=()=>screen("cli");$("tLeads").onclick=()=>screen("leads");
if(params.get("rep")){$("top").classList.add("hide");document.body.classList.add("embed");screen("cli")}

/* formulario: nombre, apellido, email, teléfono, tipo y nº de propiedades (6 campos) */
const okPhone=v=>v.replace(/\D/g,"").length>=6,okMail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
const nProps=()=>parseInt($("np").value,10)||0;
function progress(){
  const n=[$("fn").value.trim(),$("ln").value.trim(),okMail($("em").value.trim()),okPhone($("ph").value),$("ptype").value,nProps()>0].filter(Boolean).length;
  $("pb").style.width=(n/6*100)+"%";$("pt").textContent=n===6?t("ready"):t("fields",{n});
}
["fn","ln","em","ph","np"].forEach(i=>$(i).addEventListener("input",progress));
["ptype","pc"].forEach(i=>$(i).addEventListener("change",progress));
function renderThanks(){
  const s=thanksState,k={"1-2":1,"3-10":2,"+10":3}[s.seg],L=BASE.links,cal=L.cal;
  $("tthanks").textContent=t("thanks",{n:s.nombre});$("ts").textContent=t("seg"+k);
  const c=$("cta"),c2=$("cta2"),r={r:first()};
  const set4=(msg,a,ah,b,bh)=>{$("tmsg").textContent=msg;c.textContent=a+" →";c.href=ah;c2.textContent=b;c2.href=bh};
  if(k===1)set4(t("m1",r),t("trial"),L.trial,t("site"),L.web);
  else if(k===2)cal?set4(t("m2c"),t("bookDemo"),cal,t("trialMeanwhile"),L.trial):set4(t("m2",r),t("trial"),L.trial,t("site"),L.web);
  else set4(t("m3",r),t("site"),L.web,t("trialShort"),L.trial);
}
$("f").onsubmit=e=>{
  e.preventDefault();
  const num=nProps(),l={nombre:$("fn").value.trim(),apellido:$("ln").value.trim(),email:$("em").value.trim(),tel:$("pc").value+" "+$("ph").value.trim(),tipo:$("ptype").value,num,props:segOf(num)};
  if(!l.nombre||!l.apellido||!okMail(l.email)||!okPhone($("ph").value)||!l.tipo||num<1){$("err").textContent=t("err");return}
  const all=load();all.unshift({...l,evento:ev.name,comercial:rep.name,fecha:new Date().toLocaleString(LANG==="es"?"es-ES":"en-GB",{dateStyle:"short",timeStyle:"short"}),ql:true});
  set(K.leads,JSON.stringify(all));
  $("err").textContent="";$("f").classList.add("hide");$("thanks").classList.remove("hide");
  thanksState={nombre:l.nombre,seg:l.props};renderThanks();
  $("cta").onclick=()=>{const a=load();if(a[0]){a[0].clic=true;set(K.leads,JSON.stringify(a))}};
};
function render(){
  const a=load();$("cntTxt").textContent="("+a.length+")";
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const tl=v=>DICT[LANG].typeLabels[TYPES.indexOf(v)]||v;
  $("tbl").innerHTML=a.length?`<table><tr><th>${t("thLead")}</th><th>${t("thProps")}</th><th>${t("thEv")}</th><th>${t("thClick")}</th></tr>`+a.map(l=>`<tr><td><b style="font-weight:600">${esc(l.nombre)} ${esc(l.apellido)}</b><br>${esc(l.tel)}<br>${esc(l.email)}</td><td>${esc(tl(l.tipo))}<br>${esc(l.num)} (${esc(l.props)})</td><td>${esc(l.evento)}<br>${esc(l.comercial)}<br>${esc(l.fecha)}</td><td>${l.clic?"✓":"–"}</td></tr>`).join("")+"</table>":`<p class='psub'>${t("none")}</p>`;
}
$("clr").onclick=()=>{set(K.leads,"[]");render()};

$("saveVcf").onclick=()=>{
  const [fn,...ln]=rep.name.split(" ");
  const v=["BEGIN:VCARD","VERSION:3.0",`N:${ln.join(" ")};${fn};;;`,`FN:${rep.name}`,"ORG:Chekin",`TITLE:${rep.role[LANG]}`,`TEL;TYPE=CELL:${rep.phone}`,`EMAIL:${rep.email}`,`URL:${BASE.links.web}`,"NOTE:"+t("met")+ev.name,"END:VCARD"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));a.download=repId+"-chekin.vcf";document.body.appendChild(a);a.click();a.remove();
};
$("lCal").addEventListener("click",e=>{if(!BASE.links.cal)e.preventDefault()});  /* sin calendario aún: no hace nada */
showPhoto();paintQR();applyLang();
